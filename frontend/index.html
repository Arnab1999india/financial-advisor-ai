<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Bot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>💰 Financial Bot</h1>
        <p>Ask me anything about finance and investments!</p>
      </header>

      <div class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <div class="message bot-message">
            <div class="message-content">
              Hello! I'm your Financial Bot. Ask me any question about finance,
              investments, or the stock market.
            </div>
          </div>
        </div>

        <div class="input-container">
          <div class="input-stack">
            <div class="input-row">
              <textarea
                id="message-input"
                placeholder="Type your question… (Enter to send, Shift+Enter for new line)"
                maxlength="500"
                rows="2"
              ></textarea>
              <!-- Mic / voice UI paused — see voice-recognition.js, chat-voice-input.js
              <button id="mic-button" type="button" class="mic-button" ...></button>
              -->
              <button id="send-button" type="button">
                <span>Send</span>
              </button>
            </div>
            <!-- <p id="voice-hint" class="voice-hint hidden" role="status">Speak in English</p> -->
          </div>
        </div>

        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <span>Thinking...</span>
        </div>
      </div>
    </div>

    <!-- Voice scripts kept for later; not loaded while mic is disabled
    <script src="voice-recognition.js"></script>
    <script src="chat-voice-input.js"></script>
    -->
    <script src="script.js"></script>
  </body>
</html>
