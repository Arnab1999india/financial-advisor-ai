<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 2px 4px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #333;
        background: transparent;
      }
      .field-label {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 6px 2px;
      }
      .toast-region { min-height: 0; }
      .toast {
        margin: 0 0 8px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        background: #fff3e0;
        color: #e65100;
        border: 1px solid #ffcc80;
      }
      .input-stack { display: flex; flex-direction: column; gap: 6px; }
      .input-row { display: flex; align-items: flex-end; gap: 10px; width: 100%; }
      #message-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 18px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        resize: vertical;
        min-height: 44px;
        max-height: 160px;
        line-height: 1.4;
      }
      #message-input:focus { border-color: #1976d2; }
      #message-input.recording-active {
        border-color: #c62828;
        box-shadow: 0 0 0 2px rgba(198, 40, 40, 0.15);
      }
      .voice-hint {
        margin: 0;
        padding: 0 4px;
        font-size: 12px;
        color: #c62828;
        font-weight: 500;
      }
      .hidden { display: none !important; }
      .mic-button {
        position: relative;
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid #ddd;
        border-radius: 50%;
        background: #fafafa;
        color: #555;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mic-button:hover:not(:disabled) {
        background: #f0f4ff;
        border-color: #1976d2;
        color: #1976d2;
      }
      .mic-button:disabled { opacity: 0.5; cursor: not-allowed; }
      .mic-button.recording {
        background: #ffebee;
        border-color: #c62828;
        color: #c62828;
        animation: mic-pulse 1.2s ease-in-out infinite;
      }
      .mic-icon { width: 22px; height: 22px; }
      .mic-recording-dot {
        display: none;
        position: absolute;
        top: 6px;
        right: 6px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c62828;
      }
      .mic-button.recording .mic-recording-dot { display: block; }
      @keyframes mic-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.35); }
        50% { box-shadow: 0 0 0 6px rgba(198, 40, 40, 0); }
      }
      #send-button {
        flex-shrink: 0;
        padding: 12px 24px;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      #send-button:hover:not(:disabled) { background: #1565c0; }
      #send-button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
    <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
  </head>
  <body>
    <p class="field-label">Your question</p>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div class="input-stack">
      <div class="input-row">
        <textarea
          id="message-input"
          placeholder="e.g., What is P/E ratio?"
          maxlength="500"
          rows="2"
          aria-describedby="voice-hint mic-button"
        ></textarea>
        <button
          id="mic-button"
          type="button"
          class="mic-button"
          aria-pressed="false"
          aria-label="Start voice input"
          title="Transcribe spoken English into the message box"
        >
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
            />
          </svg>
          <span class="mic-recording-dot" aria-hidden="true"></span>
        </button>
        <button id="send-button" type="button"><span>Send</span></button>
      </div>
      <p id="voice-hint" class="voice-hint hidden" role="status">Speak in English</p>
    </div>

    <script>
      __VOICE_RECOGNITION_JS__
    </script>
    <script>
      __CHAT_VOICE_INPUT_JS__
    </script>
    <script>
      (function () {
        const PROPS = __PROPS_JSON__;
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const micButton = document.getElementById("mic-button");
        const voiceHint = document.getElementById("voice-hint");
        const toastRegion = document.getElementById("toast-region");

        function setFrameHeight() {
          Streamlit.setFrameHeight(document.body.scrollHeight + 8);
        }

        Streamlit.setComponentReady();
        setFrameHeight();

        const controller = ChatVoiceInput.init({
          messageInput,
          sendButton,
          micButton,
          voiceHint,
          toastRegion,
          getIsProcessing: () => Boolean(PROPS.disabled),
          onSubmit: (text) => {
            if (PROPS.disabled) return;
            messageInput.value = "";
            Streamlit.setComponentValue({ action: "send", text: text });
          },
          onResize: setFrameHeight,
        });

        controller.setProcessingDisabled(Boolean(PROPS.disabled));

        if (PROPS.clearInput) {
          messageInput.value = "";
        }
      })();
    </script>
  </body>
</html>
